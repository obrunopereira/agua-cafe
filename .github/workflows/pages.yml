name: Publicar Água & Café

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Organizar arquivos
        shell: bash
        run: |
          mkdir -p public/icons scripts tests

          organizar() {
            local destino="$1"
            local nome
            nome=$(basename "$destino")

            if [ -f "$destino" ]; then
              echo "Arquivo correto: $destino"
              return 0
            fi

            local origem
            origem=$(find . -type f -name "$nome" \
              -not -path './.git/*' -print -quit)

            if [ -z "$origem" ]; then
              echo "::error::Arquivo ausente: $nome"
              return 1
            fi

            cp "$origem" "$destino"
            echo "Organizado: $origem -> $destino"
          }

          organizar public/index.html
          organizar public/app.js
          organizar public/core.js
          organizar public/style.css
          organizar public/sw.js
          organizar public/manifest.webmanifest
          organizar public/icons/icon-192.png
          organizar public/icons/icon-512.png
          organizar scripts/build.mjs
          organizar scripts/serve.mjs
          organizar tests/core.test.cjs
          organizar package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
